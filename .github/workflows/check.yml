name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: bash -n deploy/virtualmin/prepare-first-deploy.sh
      - run: bash -n deploy/virtualmin/update-learners.sh
      - run: bash -n deploy/virtualmin/update-configuration.sh
      - run: bash -n deploy/virtualmin/update-attendance.sh
      - run: bash -n deploy/virtualmin/update-workspace-ai.sh
      - run: bash -n deploy/virtualmin/update-academic.sh
      - run: bash -n deploy/virtualmin/update-photos.sh
      - run: bash -n deploy/virtualmin/check-face-host.sh
      - run: bash -n deploy/virtualmin/update-bulk-attendance.sh
